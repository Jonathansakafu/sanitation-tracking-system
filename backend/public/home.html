<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>

body{
    margin:0;
    font-family:'Segoe UI';
    background:linear-gradient(135deg,#2e7d32,#66bb6a);
    color:white;
}

.main{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:320px;
    background:rgba(255,255,255,0.1);
    padding:30px;
    border-radius:15px;
    backdrop-filter:blur(10px);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    outline:none;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:white;
    color:#2e7d32;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#f1f1f1;
}

.register{
    text-align:center;
    margin-top:15px;
}

.register a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

</style>
</head>

<body>

<script>
const existingUser = JSON.parse(localStorage.getItem("user"));
if(existingUser){
    if(existingUser.role === "admin"){ window.location.href = "admin.html"; }
    else if(existingUser.role === "driver"){ window.location.href = "driver.html"; }
    else{ window.location.href = "index.html"; }
}
</script>

<div class="main">

    <div class="box">

        <h2>Login</h2>

        <form id="loginForm">

            <input 
                type="text" 
                id="username" 
                placeholder="Username" 
                required
            >

            <input 
                type="password" 
                id="password" 
                placeholder="Password" 
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register">
            Don't have account?
            <a href="register.html">Register</a>
        </div>

    </div>

</div>

<script>

// =======================
// LOGIN
// =======================

document.getElementById("loginForm").onsubmit = async function(e){

    e.preventDefault();

    let username = document.getElementById("username").value.trim();

    let password = document.getElementById("password").value.trim();

    if(username === "" || password === ""){

        alert("Fill all fields");
        return;

    }

    try{

        let response = await fetch("/api/login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body: JSON.stringify({
                username: username,
                password: password
            })

        });

        let data = await response.json();

        console.log(data);

        if(data.error){

            alert(data.error);
            return;

        }

        // SAVE USER
        localStorage.setItem(
            "user",
            JSON.stringify(data.user)
        );

        // REDIRECT
        if(data.user.role === "admin"){

            window.location.href = "admin.html";

        }else if(data.user.role === "driver"){

            window.location.href = "driver.html";

        }else{

            window.location.href = "index.html";

        }

    }catch(error){

        console.log(error);

        alert("Server not running");

    }

};

</script>

</body>
</html>
