<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanitation System - Login</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background:linear-gradient(135deg,#2e7d32,#66bb6a);
    color:white;
}

.nav{
    display:flex;
    justify-content:space-between;
    padding:20px 40px;
    align-items:center;
}

.nav h2{ margin:0; }

.nav-right{
    display:flex;
    gap:10px;
    align-items:center;
}

.nav button{
    padding:5px 10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.main{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-around;
    align-items:center;
    gap:30px;
    min-height:80vh;
    padding:20px 40px;
    box-sizing:border-box;
}

.left{ width:40%; }
.left h1{ font-size:36px; }
.left p{ line-height:1.6; }

.box{
    width:320px;
    max-width:100%;
    box-sizing:border-box;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    padding:30px;
    border-radius:15px;
}

@media (max-width:768px){
    .main{ flex-direction:column; text-align:center; padding:30px 20px; }
    .left{ width:100%; }
    .box{ width:100%; max-width:360px; }
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    background:rgba(255,255,255,0.2);
    color:white;
    box-sizing:border-box;
}

input::placeholder{ color:#eee; }

button.main-btn{
    width:100%;
    padding:12px;
    background:white;
    color:#2e7d32;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.about{
    text-align:center;
    padding:40px;
    background:white;
    color:#333;
}

.about h2{ color:#2e7d32; }

footer{
    text-align:center;
    padding:15px;
    background:#1b5e20;
}
</style>
</head>

<body>

<script>
const existingUser = JSON.parse(localStorage.getItem("user"));
if(existingUser){
    if(existingUser.role === "admin"){ window.location.href = "ewura.html"; }
    else if(existingUser.role === "driver"){ window.location.href = "driver.html"; }
    else if(existingUser.role === "operator"){ window.location.href = "operator.html"; }
    else{ window.location.href = "index.html"; }
}
</script>

<div class="nav">
    <h2 id="navTitle"></h2>
    <div class="nav-right">
        <a href="#about" id="aboutLink" style="color:white;"></a>
        <a href="guide.html" style="color:white;">Help</a>
        <button type="button" onclick="setLang('en')">EN</button>
        <button type="button" onclick="setLang('sw')">SW</button>
    </div>
</div>

<div class="main">
    <div class="left">
        <h1 id="welcome"></h1>
        <p id="desc1"></p>
        <p id="desc2"></p>
    </div>

    <div class="box">
        <h2 id="loginTitle"></h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="main-btn" id="loginBtn">Login</button>
        </form>
        <p style="font-size:13px;">
            <span id="noAccount"></span>
            <a href="register.html" style="color:#fff;" id="registerLink"></a>
        </p>
    </div>
</div>

<div id="about" class="about">
    <h2 id="aboutTitle"></h2>
    <p id="aboutDesc1"></p>
    <p id="aboutDesc2"></p>
</div>

<footer id="footerText"></footer>

<script>

const API = "";

let translations = {
    en:{
        navTitle:"Sanitation System",
        about:"About",
        welcome:"Welcome to Sanitation Service System",
        desc1:"This system helps users request sanitation services.",
        desc2:"Our goal is to improve public health.",
        login:"Login",
        loginBtn:"Login",
        noAccount:"Don't have an account?",
        register:"Register",
        aboutTitle:"About Us",
        aboutDesc1:"We provide digital sanitation solutions.",
        aboutDesc2:"We ensure better environmental health.",
        footer:"© 2026 Sanitation System"
    },
    sw:{
        navTitle:"Mfumo wa Usafi",
        about:"Kuhusu",
        welcome:"Karibu kwenye Mfumo wa Huduma za Usafi",
        desc1:"Mfumo huu unasaidia kuomba huduma za usafi.",
        desc2:"Lengo letu ni kuboresha afya ya jamii.",
        login:"Ingia",
        loginBtn:"Ingia",
        noAccount:"Huna akaunti?",
        register:"Jisajili",
        aboutTitle:"Kuhusu Sisi",
        aboutDesc1:"Tunatoa suluhisho za kidigitali za usafi.",
        aboutDesc2:"Tunaboresha afya ya mazingira.",
        footer:"© 2026 Mfumo wa Usafi"
    }
};

let currentLang = localStorage.getItem("lang") || "en";

function applyLang(){
    let t = translations[currentLang];
    document.getElementById("navTitle").innerText = t.navTitle;
    document.getElementById("aboutLink").innerText = t.about;
    document.getElementById("welcome").innerText = t.welcome;
    document.getElementById("desc1").innerText = t.desc1;
    document.getElementById("desc2").innerText = t.desc2;
    document.getElementById("loginTitle").innerText = t.login;
    document.getElementById("loginBtn").innerText = t.loginBtn;
    document.getElementById("noAccount").innerText = t.noAccount;
    document.getElementById("registerLink").innerText = t.register;
    document.getElementById("aboutTitle").innerText = t.aboutTitle;
    document.getElementById("aboutDesc1").innerText = t.aboutDesc1;
    document.getElementById("aboutDesc2").innerText = t.aboutDesc2;
    document.getElementById("footerText").innerText = t.footer;
}

function setLang(lang){
    localStorage.setItem("lang", lang);
    currentLang = lang;
    applyLang();
}

applyLang();

document.getElementById("loginForm").addEventListener("submit", async (e)=>{
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if(!username || !password){
        alert("All fields required");
        return;
    }

    try{
        const response = await fetch(`${API}/api/login`,{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ username, password })
        });

        const data = await response.json();

        if(data.success){

            localStorage.setItem("user", JSON.stringify(data.user));
            localStorage.setItem("currentUser", data.user.username);

            if(data.role === "admin"){
                window.location.href = "ewura.html";
            }
            else if(data.role === "driver"){
                window.location.href = "driver.html";
            }
            else if(data.role === "operator"){
                window.location.href = "operator.html";
            }
            else{
                window.location.href = "index.html";
            }

        } else {
            alert(data.error || "Invalid Login");
        }

    } catch(error){
        console.log(error);
        alert("Server Error");
    }
});

</script>
</body>
</html>
